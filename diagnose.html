async function health(api,log){const attempts=[];const t0=Date.now();
 while(Date.now()-t0<120000){const t=Date.now();try{const c=new AbortController(),k=setTimeout(()=>c.abort(),10000);const r=await fetch(api+'/health',{cache:'no-store',signal:c.signal});clearTimeout(k);const text=await r.text();let info=null;try{info=JSON.parse(text)}catch{}
